version: '3'

tasks:
  env:
    desc: Set up the env vars
    cmds:
      - cp .env.example .env
    sources:
      - .env.example

  install:
    desc: Install all dependencies including development groups
    deps: [env]
    cmds:
      - uv sync --all-groups
    sources:
      - pyproject.toml
      - uv.lock
    generates:
      - .venv/**/*

  format:
    desc: Format code using ruff
    deps: [install]
    cmds:
      - uv run ruff format .

  lint:
    desc: Run all linting tools
    deps: [install]
    cmds:
      - uv run ruff check --fix .

  type_check:
    desc: Run type checking using mypy
    deps: [install]
    cmds:
      - uv run mypy src/ tests/

  test:
    desc: Run all tests with coverage
    deps: [install]
    cmds:
      - uv run pytest --cov=src tests/

  qa:
    desc: Run all quality assurance tasks (format, lint, type_check) in order
    deps: [install]
    cmds:
      - task: format
      - task: lint
      - task: type_check
      - task: test

  clean:
    desc: Clean up generated files
    cmds:
      - rm -rf .mypy_cache/
      - rm -rf .pytest_cache/
      - rm -rf .ruff_cache/
      - rm -rf .task/
      - rm -rf __pycache__/
      - rm -rf .coverage
      - find . -type d -name "*.egg-info" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete

  help:
    desc: Show available tasks
    cmds:
      - task --list