version: '3'

tasks:
  install:
    desc: Install all dependencies including development groups
    cmds:
      - uv sync --all-groups
    sources:
      - pyproject.toml
      - uv.lock
    generates:
      - .venv/**/*

  format:
    desc: Format code using ruff
    deps: [install]
    cmds:
      - uv run ruff format .

  lint:
    desc: Run all linting tools
    deps: [install]
    cmds:
      - uv run ruff check --fix .

  type_check:
    desc: Run type checking using mypy
    deps: [install]
    cmds:
      - uv run mypy src/ tests/

  qa:
    desc: Run all quality assurance tasks (linting and type checking)
    deps: [format, lint, type_check]

  clean:
    desc: Clean up generated files
    cmds:
      - rm -rf .pytest_cache/
      - rm -rf __pycache__/
      - find . -type d -name "*.egg-info" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete

  help:
    desc: Show available tasks
    cmds:
      - task --list