version: "3"
# This top-level 'vars' block is essential.
vars:
  OLD_PACKAGE_NAME: template_package
tasks:
  env:
    desc: Set up the env vars
    cmds:
      - cp .env.example .env
    sources:
      - .env.example

  install:
    desc: Install all dependencies including development tools
    deps: [env]
    cmds:
      - uv sync --all-groups
      - uv run pre-commit install
    sources:
      - pyproject.toml
      - uv.lock
    generates:
      - .venv/**/*

  format:
    desc: Format code using ruff
    deps: [install]
    cmds:
      - uv run ruff format .

  lint:
    desc: Run all linting tools
    deps: [install]
    cmds:
      - uv run ruff check --fix .

  type_check:
    desc: Run type checking using mypy
    deps: [install]
    cmds:
      - uv run mypy src/ tests/

  test:
    desc: Run all tests with coverage
    deps: [install]
    cmds:
      - uv run pytest --cov=src tests/

  qa:
    desc: Run all quality assurance tasks (format, lint, type_check) in order
    deps: [install]
    cmds:
      - task: format
      - task: lint
      - task: type_check
      - task: test

  clean:
    desc: Clean up generated files
    cmds:
      - rm -rf .mypy_cache/
      - rm -rf .pytest_cache/
      - rm -rf .ruff_cache/
      - rm -rf .task/
      - rm -rf __pycache__/
      - rm -rf .coverage
      - find . -type d -name "*.egg-info" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete

  help:
    desc: Show available tasks
    cmds:
      - task --list

  rename:
    desc: "Initializes the project from the template by renaming the package and module."
    summary: |
      This task renames the template package and module to your desired names.
      It modifies file contents, renames files and directories, and then can be removed.

      Usage:
        task setup -- <new-package-name>

      Example:
        task setup -- awesome_api
    vars:
      PACKAGE_NAME: '{{.CLI_ARGS}}'
    preconditions:
      - sh: 'test -n "{{.PACKAGE_NAME}}"'
        msg: "❌ Missing arguments. Usage: task setup -- <new-package-name>"
      - sh: 'test -d "src/{{.OLD_PACKAGE_NAME}}"'
        msg: "🤔 Project seems to be already set up. 'src/{{.OLD_PACKAGE_NAME}}' not found."
    cmds:
      - echo "🚀 Initializing project with package '{{.PACKAGE_NAME}}'"
      # Replace all string occurrences in files.
      # We use `find` to locate relevant files and `sed` to perform in-place replacement.
      # The `-i.bak` flag is used for cross-platform compatibility (macOS & Linux).
      - |
        find src tests pyproject.toml README.md Taskfile.yml -type f -print0 | \
        xargs -0 sed -i.bak 's/{{.OLD_PACKAGE_NAME}}/{{.PACKAGE_NAME}}/g'
      # Rename the directories and files.
      - mv src/{{.OLD_PACKAGE_NAME}} src/{{.PACKAGE_NAME}}
      - mv tests/{{.OLD_PACKAGE_NAME}} tests/{{.PACKAGE_NAME}}
      # Clean up the backup files created by sed.
      - find . -name "*.bak" -type f -delete
      - echo "✅ Project setup complete!"
      - echo "ℹ️  You can now delete the 'setup' task from your Taskfile.yml."
